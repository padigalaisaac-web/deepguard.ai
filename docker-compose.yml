version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deepguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepguard
      POSTGRES_USER: deepguard_user
      POSTGRES_PASSWORD: deepguard_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepguard_user -d deepguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://deepguard_user:deepguard_secure_password_2026@postgres:5432/deepguard
      - SECRET_KEY=deepguard-super-secret-key-change-in-production-2026-xyz-security
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  backend_uploads:
  backend_reports:
